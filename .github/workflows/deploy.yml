name: Deploy to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: discord-example-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull, deploy, and show service logs
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository variable}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER repository variable}"
          : "${DEPLOY_SSH_KEY:?Set the DEPLOY_SSH_KEY repository secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set the DEPLOY_KNOWN_HOSTS repository secret}"

          key_file="$RUNNER_TEMP/discord-example-deploy-key"
          known_hosts_file="$RUNNER_TEMP/discord-example-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"

          ssh \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/opc/discord-example-app
          git pull --ff-only origin main
          npm ci --omit=dev

          if ! npm run deploy; then
            sudo journalctl -u discord-example.service -n 100 --no-pager || true
            exit 1
          fi

          sudo systemctl is-active --quiet discord-example.service
          sudo journalctl -u discord-example.service -n 100 --no-pager
          REMOTE
